appId: sh.inscope.ciag.toolbox
productName: CHARM Toolbox
copyright: Copyright (c) 2026 Cambridge Image Analysis (CIA)
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/*.{ts,tsx,map}"
  - "!**/.{eslintrc,eslintrc.cjs,prettierrc,gitignore}"
asar: true
# The bundled Python runtime (installed into .python/ by scripts/setup-python-runtime.mjs)
# ships outside the asar archive so the interpreter binaries stay executable.
# Each OS build packages the runtime installed on that OS (build:win -> Windows
# runtime, build:mac -> macOS runtime); the CI release workflow builds per-OS.
extraResources:
  - from: .python
    to: python
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  # The built-in Stage 6 algorithm scripts (CT-307); resolved at runtime by
  # src/main/python/builtin-scripts.ts and asserted present by the afterPack hook.
  - from: resources/builtin-python
    to: builtin-python
    filter:
      - "**/*.py"
# afterPack verifies the runtime actually landed in the packed app (electron-builder
# only WARNS when the .python extraResources source is missing) and then signs the
# runtime binaries on macOS (CT-262).
afterPack: scripts/after-pack.mjs
publish: null
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CHARM Toolbox
  uninstallDisplayName: CHARM Toolbox ${version}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.graphics-design
  # Local/CI default is ad-hoc signing; export MSI_MAC_SIGNING_IDENTITY (or CSC_NAME/
  # CSC_LINK) for a real Developer ID. Hardened runtime + the entitlements below are
  # required for notarizing the bundled Python binaries (signed inside-out by the
  # afterPack hook before electron-builder signs the outer app).
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Notarization runs only when Apple credentials are present in the environment
  # (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID); otherwise it is skipped.
  notarize: true
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  writeUpdateInfo: false
linux:
  target:
    - target: deb
      arch: x64
  icon: build/icon.png
  category: Graphics
  executableName: charm-toolbox
  maintainer: Cambridge Image Analysis Group (CIAG) <evan.morgan@inscope.sh>
  synopsis: Multispectral image analysis
  artifactName: charm-toolbox_${version}_${arch}.${ext}
